<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a3990">
  <title>Login - RGMCET Smart Campus</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">

  <div class="login-top">
    <img src="icons/icon-192.png" alt="RGMCET logo">
    <h1>RGMCET Smart Campus</h1>
    <p>Student App</p>
  </div>

  <div class="login-card">
    <h5 class="mb-3">Student Login</h5>

    <div id="loginError" class="alert alert-danger d-none py-2"></div>

    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label" for="roll">Roll Number</label>
        <input type="text" class="form-control form-control-lg" id="roll" placeholder="Example: 23091A0512"
               autocapitalize="characters" autocomplete="username" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input type="password" class="form-control form-control-lg" id="password" placeholder="Enter your password"
               autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-lg w-100" id="loginButton">Login</button>
    </form>

    <!-- DEMO ONLY: delete this box when the real PHP login is ready -->
    <div class="alert alert-info mt-3 mb-0 py-2 small">
      <b>Demo login</b><br>
      Roll number: 23091A0512<br>
      Password: student123
    </div>
  </div>

  <p class="text-center text-muted small mt-4 mb-4">Rajeev Gandhi Memorial College of Engineering and Technology</p>

</div>

<script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
  registerServiceWorker();

  // If the student is already logged in, go straight to the home page
  if (getLoggedInRoll() != "") {
    window.location.href = "home.html";
  }

  document.getElementById("loginForm").addEventListener("submit", async function (event) {
    event.preventDefault();   // stops the page from reloading

    var roll = document.getElementById("roll").value.trim().toUpperCase();
    var password = document.getElementById("password").value;
    var errorBox = document.getElementById("loginError");
    var button = document.getElementById("loginButton");

    button.disabled = true;
    button.textContent = "Please wait...";
    errorBox.classList.add("d-none");

    try {
      var ok = await loginStudent(roll, password);
      if (ok) {
        window.location.href = "home.html";
      } else {
        errorBox.textContent = "Roll number or password is wrong.";
        errorBox.classList.remove("d-none");
      }
    } catch (error) {
      errorBox.textContent = "Could not connect. Please try again.";
      errorBox.classList.remove("d-none");
    }

    button.disabled = false;
    button.textContent = "Login";
  });
</script>
</body>
</html>
