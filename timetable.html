<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a3990">
  <title>Examination Timetable - RGMCET</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <div id="topbar"></div>
  <main class="app-main" id="content"><div class="loading-box">Loading...</div></main>
  <div id="bottomnav"></div>
</div>

<script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
  setupPage({ title: "Exam Timetable", active: "exams", back: true });

  var WEEK_DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

  // Gives the day name for a date like "2026-12-14"
  function dayName(text) {
    var parts = text.split("-");
    var d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    return WEEK_DAYS[d.getDay()];
  }

  async function start() {
    var timetable = await getData("exam_timetable");

    var html = '<div class="card-lite">' +
                 '<b>' + esc(timetable.title) + '</b>' +
                 '<div class="mt-2">' + fileButtons(timetable.pdf) + '</div>' +
               '</div>';

    html += '<div class="section-title">Schedule</div>';

    var today = todayText();
    for (var i = 0; i < timetable.exams.length; i++) {
      var e = timetable.exams[i];
      var parts = e.date.split("-");
      var upcoming = "";
      if (e.date >= today) {
        upcoming = '<span class="badge text-bg-primary">Upcoming</span>';
      }

      html += '<div class="list-row">' +
                '<div class="icon-chip chip-blue" style="flex-direction:column;font-size:16px;line-height:1;width:54px;height:54px">' +
                  '<b>' + Number(parts[2]) + '</b><span style="font-size:11px">' + MONTH_NAMES[Number(parts[1]) - 1] + '</span>' +
                '</div>' +
                '<div class="row-text">' +
                  '<div class="row-title">' + esc(e.subject) + '</div>' +
                  '<div class="row-sub">' + dayName(e.date) + ' &middot; ' + esc(e.code) + '</div>' +
                  '<div class="row-sub">' + esc(e.session) + '</div>' +
                '</div>' + upcoming +
              '</div>';
    }

    document.getElementById("content").innerHTML = html;
  }

  runPage(start);
</script>
</body>
</html>
