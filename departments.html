<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a3990">
  <title>Departments - RGMCET</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <div id="topbar"></div>
  <main class="app-main" id="content"><div class="loading-box">Loading...</div></main>
  <div id="bottomnav"></div>
</div>

<script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
  setupPage({ title: "Departments", active: "more", back: true });

  async function start() {
    var departments = await getData("departments");
    var me = await getMyProfile();

    var html = "";
    for (var i = 0; i < departments.length; i++) {
      var d = departments[i];

      var yours = "";
      if (d.code == me.department) {
        yours = ' <span class="badge text-bg-success">Your department</span>';
      }

      html += '<a class="list-row" href="department.html?code=' + encodeURIComponent(d.code) + '">' +
                '<div class="icon-chip chip-blue"><i class="bi ' + esc(d.icon) + '"></i></div>' +
                '<div class="row-text"><div class="row-title">' + esc(d.name) + yours + '</div>' +
                '<div class="row-sub">HOD: ' + esc(d.hod) + '</div></div>' +
                '<i class="bi bi-chevron-right"></i>' +
              '</a>';
    }

    document.getElementById("content").innerHTML = html;
  }

  runPage(start);
</script>
</body>
</html>
