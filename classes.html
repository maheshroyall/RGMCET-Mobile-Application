<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a3990">
  <title>Class Timetable - RGMCET</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <div id="topbar"></div>
  <main class="app-main" id="content"><div class="loading-box">Loading...</div></main>
  <div id="bottomnav"></div>
</div>

<script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
  setupPage({ title: "Class Timetable", active: "more", back: true });

  var timetable = null;
  var selectedDay = 0;   // position of the selected day in the list (0 = Monday)

  function showDays() {
    var html = "";
    for (var i = 0; i < timetable.days.length; i++) {
      var activeClass = "";
      if (i == selectedDay) {
        activeClass = " active";
      }
      html += '<button class="pill-tab' + activeClass + '" onclick="chooseDay(' + i + ')">' + timetable.days[i].day.substring(0, 3) + '</button>';
    }
    document.getElementById("dayTabs").innerHTML = html;
  }

  function chooseDay(position) {
    selectedDay = position;
    showDays();
    showPeriods();
  }

  function showPeriods() {
    var day = timetable.days[selectedDay];
    var html = "";
    for (var i = 0; i < day.classes.length; i++) {
      var name = day.classes[i];
      var color = "chip-blue";
      var icon = "bi-book";
      if (name == "Lunch") {
        color = "chip-amber";
        icon = "bi-cup-hot";
      }
      html += '<div class="list-row">' +
                '<div class="icon-chip ' + color + '"><i class="bi ' + icon + '"></i></div>' +
                '<div class="row-text"><div class="row-title">' + esc(name) + '</div>' +
                '<div class="row-sub">Period ' + (i + 1) + ' &middot; ' + esc(timetable.periods[i]) + '</div></div>' +
              '</div>';
    }
    document.getElementById("periodList").innerHTML = html;
  }

  async function start() {
    timetable = await getData("class_timetable");

    // Start with today's day (Sunday has no classes, so we show Monday)
    var todayNumber = new Date().getDay();   // 0 = Sunday, 1 = Monday ...
    if (todayNumber >= 1 && todayNumber <= timetable.days.length) {
      selectedDay = todayNumber - 1;
    }

    document.getElementById("content").innerHTML =
      '<div class="card-lite"><b>' + esc(timetable.title) + '</b></div>' +
      '<div class="pill-tabs" id="dayTabs"></div>' +
      '<div id="periodList"></div>';

    showDays();
    showPeriods();
  }

  runPage(start);
</script>
</body>
</html>
