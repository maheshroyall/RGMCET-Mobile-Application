<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a3990">
  <title>Fees - RGMCET</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <div id="topbar"></div>
  <main class="app-main" id="content"><div class="loading-box">Loading...</div></main>
  <div id="bottomnav"></div>
</div>

<script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
  setupPage({ title: "Fee Details", active: "fees", back: false });

  var fees = null;
  var currentTab = "All";
  var TABS = ["All", "College", "Hostel", "Bus", "Examination", "Other", "Receipts"];

  function showTabs() {
    var html = "";
    for (var i = 0; i < TABS.length; i++) {
      var activeClass = "";
      if (TABS[i] == currentTab) {
        activeClass = " active";
      }
      html += '<button class="pill-tab' + activeClass + '" onclick="chooseTab(\'' + TABS[i] + '\')">' + TABS[i] + '</button>';
    }
    document.getElementById("tabs").innerHTML = html;
  }

  function chooseTab(name) {
    currentTab = name;
    showTabs();
    showTabContent();
  }

  function showTabContent() {
    var html = "";

    // Receipts and payment history
    if (currentTab == "Receipts") {
      for (var i = 0; i < fees.receipts.length; i++) {
        var r = fees.receipts[i];
        var txn = "";
        if (r.transactionId) {
          txn = ' &middot; ' + esc(r.transactionId);
        }
        html += '<div class="card-lite">' +
                  '<div class="d-flex justify-content-between"><b>' + esc(r.title) + '</b><b class="text-success">' + formatMoney(r.amount) + '</b></div>' +
                  '<div class="small text-muted mb-2">' + formatDate(r.date) + ' &middot; ' + esc(r.mode) + txn + '<br>Receipt No: ' + esc(r.receiptNo) + '</div>' +
                  fileButtons(r.pdf) +
                '</div>';
      }
      document.getElementById("tabContent").innerHTML = html;
      return;
    }

    // Fee dues
    var today = todayText();
    for (var i = 0; i < fees.dues.length; i++) {
      var d = fees.dues[i];
      if (currentTab != "All" && d.category != currentTab) {
        continue;
      }

      var balance = d.amount - d.paid;
      var percent = Math.round((d.paid / d.amount) * 100);

      // Status label
      var status = '<span class="badge text-bg-success">Paid</span>';
      var barColor = "bg-success";
      if (balance > 0 && d.dueDate < today) {
        status = '<span class="badge text-bg-danger">Overdue</span>';
        barColor = "bg-danger";
      } else if (balance > 0 && d.paid > 0) {
        status = '<span class="badge text-bg-warning">Partly paid</span>';
        barColor = "bg-warning";
      } else if (balance > 0) {
        status = '<span class="badge text-bg-secondary">Pending</span>';
      }

      html += '<div class="card-lite">' +
                '<div class="d-flex justify-content-between align-items-start mb-2"><b>' + esc(d.title) + '</b>' + status + '</div>' +
                '<div class="progress mb-2"><div class="progress-bar ' + barColor + '" style="width:' + percent + '%"></div></div>' +
                '<div class="row text-center g-0">' +
                  '<div class="col-4"><div class="small text-muted">Total</div><b>' + formatMoney(d.amount) + '</b></div>' +
                  '<div class="col-4"><div class="small text-muted">Paid</div><b class="text-success">' + formatMoney(d.paid) + '</b></div>' +
                  '<div class="col-4"><div class="small text-muted">Balance</div><b class="text-danger">' + formatMoney(balance) + '</b></div>' +
                '</div>' +
                '<div class="small text-muted mt-2">Due date: ' + formatDate(d.dueDate) + '</div>' +
              '</div>';
    }

    if (html == "") {
      html = emptyBox("No fee details in this section.");
    }
    document.getElementById("tabContent").innerHTML = html;
  }

  async function start() {
    fees = await getData("fees");

    var totalDue = 0;
    for (var i = 0; i < fees.dues.length; i++) {
      totalDue = totalDue + (fees.dues[i].amount - fees.dues[i].paid);
    }

    var heroText = "All fees are paid";
    if (totalDue > 0) {
      heroText = formatMoney(totalDue);
    }

    document.getElementById("content").innerHTML =
      '<div class="hero">' +
        '<small>Total balance to pay</small>' +
        '<h2>' + heroText + '</h2>' +
        '<span class="hero-info">For payment, contact the accounts section</span>' +
      '</div>' +
      '<div class="pill-tabs mt-3" id="tabs"></div>' +
      '<div id="tabContent"></div>';

    showTabs();
    showTabContent();
  }

  runPage(start);
</script>
</body>
</html>
