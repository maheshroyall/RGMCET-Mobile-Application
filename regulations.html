<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a3990">
  <title>Regulations - RGMCET</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <div id="topbar"></div>
  <main class="app-main" id="content"><div class="loading-box">Loading...</div></main>
  <div id="bottomnav"></div>
</div>

<script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
  setupPage({ title: "Regulations", active: "exams", back: true });

  async function start() {
    var list = await getData("regulations");
    var me = await getMyProfile();

    var html = "";
    for (var i = 0; i < list.length; i++) {
      var r = list[i];

      // Mark the regulation that applies to this student
      var yours = "";
      if (r.code == me.regulation) {
        yours = ' <span class="badge text-bg-success">Your regulation</span>';
      }

      html += '<div class="card-lite">' +
                '<div class="d-flex align-items-center gap-3 mb-2">' +
                  '<div class="icon-chip chip-red m-0"><b>' + esc(r.code) + '</b></div>' +
                  '<div><div class="fw-semibold">' + esc(r.title) + yours + '</div>' +
                  '<div class="text-muted small">' + esc(r.appliesTo) + '</div></div>' +
                '</div>' +
                fileButtons(r.pdf) +
              '</div>';
    }

    document.getElementById("content").innerHTML = html;
  }

  runPage(start);
</script>
</body>
</html>
