<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a3990">
  <title>Notifications - RGMCET</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <div id="topbar"></div>

  <main class="app-main">
    <div class="pill-tabs" id="filterTabs"></div>
    <div class="text-end mb-2">
      <button class="btn btn-sm btn-link text-decoration-none" onclick="markAllRead()">Mark all as read</button>
    </div>
    <div id="content"><div class="loading-box">Loading...</div></div>
  </main>

  <div id="bottomnav"></div>
</div>

<script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
  setupPage({ title: "Notifications", active: "home", back: true });

  var notifications = [];
  var currentFilter = "All";
  var FILTERS = ["All", "General", "Examination", "Academic", "Fee", "Department", "Emergency", "Discipline"];

  // Icon and colour for each category
  var CATEGORY_STYLE = {
    "General":     { color: "chip-blue",   icon: "bi-info-circle" },
    "Examination": { color: "chip-red",    icon: "bi-journal-check" },
    "Academic":    { color: "chip-teal",   icon: "bi-mortarboard" },
    "Fee":         { color: "chip-amber",  icon: "bi-wallet2" },
    "Department":  { color: "chip-purple", icon: "bi-buildings" },
    "Emergency":   { color: "chip-red",    icon: "bi-exclamation-triangle" },
    "Discipline":  { color: "chip-green",  icon: "bi-shield-check" }
  };

  function showFilters() {
    var html = "";
    for (var i = 0; i < FILTERS.length; i++) {
      var activeClass = "";
      if (FILTERS[i] == currentFilter) {
        activeClass = " active";
      }
      html += '<button class="pill-tab' + activeClass + '" onclick="chooseFilter(\'' + FILTERS[i] + '\')">' + FILTERS[i] + '</button>';
    }
    document.getElementById("filterTabs").innerHTML = html;
  }

  function chooseFilter(name) {
    currentFilter = name;
    showFilters();
    showList();
  }

  function showList() {
    var html = "";
    for (var i = 0; i < notifications.length; i++) {
      var n = notifications[i];
      if (currentFilter != "All" && n.category != currentFilter) {
        continue;
      }

      var style = CATEGORY_STYLE[n.category] || CATEGORY_STYLE["General"];
      var cssClass = "list-row circular-card unread";
      if (isRead("notification", n.id)) {
        cssClass = "list-row circular-card";
      }

      html += '<div class="' + cssClass + '" onclick="openNotification(' + n.id + ')">' +
                '<div class="icon-chip ' + style.color + '"><i class="bi ' + style.icon + '"></i></div>' +
                '<div class="row-text">' +
                  '<div class="row-title">' + esc(n.title) + '</div>' +
                  '<div class="row-sub">' + esc(n.message) + '</div>' +
                  '<div class="row-sub"><small>' + formatDateTime(n.dateTime) + ' &middot; ' + esc(n.category) + '</small></div>' +
                '</div>' +
              '</div>';
    }

    if (html == "") {
      html = emptyBox("No notifications.");
    }
    document.getElementById("content").innerHTML = html;
  }

  // Tap on a notification: mark it as read and go to the related page
  function openNotification(id) {
    markAsRead("notification", id);
    for (var i = 0; i < notifications.length; i++) {
      if (notifications[i].id == id) {
        if (notifications[i].link && notifications[i].link != "notifications.html") {
          window.location.href = notifications[i].link;
          return;
        }
      }
    }
    showList();
    showUnreadCount();
  }

  function markAllRead() {
    for (var i = 0; i < notifications.length; i++) {
      markAsRead("notification", notifications[i].id);
    }
    showList();
    document.getElementById("bellCount").classList.add("d-none");
  }

  async function start() {
    notifications = await getData("notifications");

    // The page address can ask for one category: notifications.html?category=Examination
    var wanted = getParam("category");
    if (FILTERS.indexOf(wanted) != -1) {
      currentFilter = wanted;
    }

    showFilters();
    showList();
  }

  runPage(start);
</script>
</body>
</html>
